<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker><marker id="oa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#1a1a1a" stroke-width="1.3"/></marker><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#fff" stroke="#1a1a1a" stroke-width="1.3"/></marker></defs><rect width="1000" height="640" fill="#fff"/><rect x="20" y="20" width="300" height="600" rx="14" fill="#fafbff" stroke="#1B2A7A" stroke-width="2"/><text x="170" y="50" font-family="GSans" font-size="16" font-weight="bold" fill="#1B2A7A" text-anchor="middle">Perangkat pengguna (browser)</text><text x="170" y="70" font-family="GSans" font-size="12" fill="#4a4a4a" text-anchor="middle">HP Android/iOS atau laptop, tanpa login</text><rect x="45" y="90" width="250" height="78" rx="8" fill="#fff" stroke="#1a1a1a" stroke-width="1.6"/><text x="170.0" y="117.25" font-family="GSans" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Halaman Cek (FormCek)</text><text x="170.0" y="137.75" font-family="GSans" font-size="12" fill="#4a4a4a" text-anchor="middle">Tempel teks 50–3.000 karakter</text><text x="170.0" y="153.35000000000002" font-family="GSans" font-size="12" fill="#4a4a4a" text-anchor="middle">Contoh siap pakai (4 tombol)</text><rect x="45" y="185" width="250" height="92" rx="8" fill="#E8ECFB" stroke="#1a1a1a" stroke-width="1.6"/><text x="170.0" y="211.45" font-family="GSans" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">OCR di browser</text><text x="170.0" y="231.95" font-family="GSans" font-size="12" fill="#4a4a4a" text-anchor="middle">Tesseract.js di Web Worker</text><text x="170.0" y="247.55" font-family="GSans" font-size="12" fill="#4a4a4a" text-anchor="middle">data bahasa ind + eng di-host sendiri</text><text x="170.0" y="263.15" font-family="GSans" font-size="12" fill="#4a4a4a" text-anchor="middle">gambar tidak pernah diunggah</text><rect x="45" y="294" width="250" height="92" rx="8" fill="#fff" stroke="#1a1a1a" stroke-width="1.6"/><text x="170.0" y="320.45000000000005" font-family="GSans" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Tampilan hasil</text><text x="170.0" y="340.95000000000005" font-family="GSans" font-size="12" fill="#4a4a4a" text-anchor="middle">Label + ikon + kata, Skor</text><text x="170.0" y="356.55" font-family="GSans" font-size="12" fill="#4a4a4a" text-anchor="middle">sorotan Kutipan pemicu (&lt;mark&gt;)</text><text x="170.0" y="372.15000000000003" font-family="GSans" font-size="12" fill="#4a4a4a" text-anchor="middle">aria-live, fokus ke judul hasil</text><rect x="45" y="403" width="250" height="78" rx="8" fill="#fff" stroke="#1a1a1a" stroke-width="1.6"/><text x="170.0" y="438.05" font-family="GSans" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Langkah aman &amp; darurat</text><text x="170.0" y="458.55" font-family="GSans" font-size="12" fill="#4a4a4a" text-anchor="middle">tautan kanal resmi + domainnya</text><rect x="45" y="498" width="250" height="98" rx="8" fill="#fff" stroke="#1a1a1a" stroke-width="1.6"/><text x="170.0" y="527.45" font-family="GSans" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Halaman Cara kerja</text><text x="170.0" y="547.95" font-family="GSans" font-size="12" fill="#4a4a4a" text-anchor="middle">ringkasan Aturan, akurasi Set test</text><text x="170.0" y="563.5500000000001" font-family="GSans" font-size="12" fill="#4a4a4a" text-anchor="middle">(pembilang/penyebut), batasan,</text><text x="170.0" y="579.15" font-family="GSans" font-size="12" fill="#4a4a4a" text-anchor="middle">kebijakan privasi</text><line x1="170" y1="277" x2="170" y2="294" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ah)"/><rect x="370" y="20" width="390" height="600" rx="14" fill="#fbfbf8" stroke="#1a1a1a" stroke-width="2"/><text x="565" y="50" font-family="GSans" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Vercel — Next.js (App Router, TypeScript)</text><rect x="395" y="75" width="340" height="62" rx="8" fill="#fff" stroke="#1a1a1a" stroke-width="1.6"/><text x="565.0" y="102.05" font-family="GSans" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Route Handler POST /api/cek</text><text x="565.0" y="122.55000000000001" font-family="GSans" font-size="12" fill="#4a4a4a" text-anchor="middle">parse JSON → cek() → JSON, isi Teks tidak di-log</text><rect x="395" y="155" width="340" height="440" rx="10" fill="#E8ECFB" stroke="#1B2A7A" stroke-width="1.8"/><text x="565" y="180" font-family="GSans" font-size="14" font-weight="bold" fill="#1B2A7A" text-anchor="middle">Inti Cek: cek(teks, { ai }) → HasilCek</text><rect x="415" y="195" width="300" height="54" rx="8" fill="#fff" stroke="#1a1a1a" stroke-width="1.6"/><text x="565.0" y="218.42499999999998" font-family="GSans" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Validasi panjang</text><text x="565.0" y="237.275" font-family="GSans" font-size="11" fill="#4a4a4a" text-anchor="middle">50–3.000 karakter setelah trim</text><rect x="415" y="261" width="300" height="54" rx="8" fill="#fff" stroke="#1a1a1a" stroke-width="1.6"/><text x="565.0" y="284.425" font-family="GSans" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. Mesin Aturan (deterministik)</text><text x="565.0" y="303.27500000000003" font-family="GSans" font-size="11" fill="#4a4a4a" text-anchor="middle">katalog ≥ 15 Aturan, Penyangkal, kutipan</text><line x1="565" y1="249" x2="565" y2="261" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ah)"/><rect x="415" y="327" width="300" height="54" rx="8" fill="#fff" stroke="#1a1a1a" stroke-width="1.6"/><text x="565.0" y="350.425" font-family="GSans" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3. Penyamaran → Adapter AI</text><text x="565.0" y="369.27500000000003" font-family="GSans" font-size="11" fill="#4a4a4a" text-anchor="middle">HP/NIK/rekening/email → penanda</text><line x1="565" y1="315" x2="565" y2="327" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ah)"/><rect x="415" y="393" width="300" height="54" rx="8" fill="#fff" stroke="#1a1a1a" stroke-width="1.6"/><text x="565.0" y="416.425" font-family="GSans" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">4. Saring Tanda bahaya AI</text><text x="565.0" y="435.27500000000003" font-family="GSans" font-size="11" fill="#4a4a4a" text-anchor="middle">Zod, kutipan wajib ada, tanpa irisan</text><line x1="565" y1="381" x2="565" y2="393" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ah)"/><rect x="415" y="459" width="300" height="54" rx="8" fill="#fff" stroke="#1a1a1a" stroke-width="1.6"/><text x="565.0" y="482.425" font-family="GSans" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">5. Skor, Label, Modus terkuat</text><text x="565.0" y="501.27500000000003" font-family="GSans" font-size="11" fill="#4a4a4a" text-anchor="middle">min(100, Σ bobot), ambang 25 / 60</text><line x1="565" y1="447" x2="565" y2="459" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ah)"/><rect x="415" y="525" width="300" height="54" rx="8" fill="#fff" stroke="#1a1a1a" stroke-width="1.6"/><text x="565.0" y="548.4250000000001" font-family="GSans" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">6. Penjelasan + Langkah aman</text><text x="565.0" y="567.275" font-family="GSans" font-size="11" fill="#4a4a4a" text-anchor="middle">copy statis, tanpa kata terlarang</text><line x1="565" y1="513" x2="565" y2="525" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ah)"/><line x1="565" y1="137" x2="565" y2="155" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ah)"/><rect x="800" y="250" width="180" height="150" rx="14" fill="#f3e8fd" stroke="#5b2a86" stroke-width="2"/><text x="890" y="282.0" font-family="GSans" font-size="16" font-weight="bold" fill="#5b2a86" text-anchor="middle">Groq API</text><text x="890" y="306" font-family="GSans" font-size="12" fill="#4a4a4a" text-anchor="middle">openai/gpt-oss-120b</text><text x="890" y="323" font-family="GSans" font-size="12" fill="#4a4a4a" text-anchor="middle">strict json_schema</text><text x="890" y="340" font-family="GSans" font-size="12" fill="#4a4a4a" text-anchor="middle">timeout 3,5 detik</text><text x="890" y="357" font-family="GSans" font-size="12" fill="#4a4a4a" text-anchor="middle">hanya menambah ≤ +25</text><line x1="715" y1="340" x2="800" y2="330" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ah)"/><line x1="800" y1="365" x2="715" y2="375" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/><rect x="712.96" y="309" width="88.08000000000001" height="17" rx="3" fill="#fff" stroke="#fff" stroke-width="0"/><text x="757" y="320" font-family="GSans" font-size="11" fill="#4a4a4a" text-anchor="middle">Teks tersamar</text><rect x="740.68" y="381" width="32.64" height="17" rx="3" fill="#fff" stroke="#fff" stroke-width="0"/><text x="757" y="392" font-family="GSans" font-size="11" fill="#4a4a4a" text-anchor="middle">JSON</text><rect x="800" y="440" width="180" height="155" rx="10" fill="#fff" stroke="#6b6b6b" stroke-width="1.5" stroke-dasharray="6 4"/><text x="890" y="465.0" font-family="GSans" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Data statis (repo)</text><text x="890" y="488" font-family="GSans" font-size="11" fill="#4a4a4a" text-anchor="middle">katalog Aturan</text><text x="890" y="504" font-family="GSans" font-size="11" fill="#4a4a4a" text-anchor="middle">copy Langkah aman</text><text x="890" y="520" font-family="GSans" font-size="11" fill="#4a4a4a" text-anchor="middle">keluaran AI contoh</text><text x="890" y="536" font-family="GSans" font-size="11" fill="#4a4a4a" text-anchor="middle">hasil eval (JSON)</text><text x="890" y="552" font-family="GSans" font-size="11" fill="#4a4a4a" text-anchor="middle">tanpa basis data</text><text x="890" y="568" font-family="GSans" font-size="11" fill="#4a4a4a" text-anchor="middle">Teks tidak disimpan</text><line x1="800" y1="520" x2="735" y2="520" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/><line x1="295" y1="128" x2="395" y2="105" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ah)"/><rect x="325.6" y="89" width="38.800000000000004" height="17" rx="3" fill="#fff" stroke="#fff" stroke-width="0"/><text x="345" y="100" font-family="GSans" font-size="11" fill="#4a4a4a" text-anchor="middle">HTTPS</text><line x1="395" y1="120" x2="295" y2="330" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/><rect x="316.36" y="217" width="57.28" height="17" rx="3" fill="#fff" stroke="#fff" stroke-width="0"/><text x="345" y="228" font-family="GSans" font-size="11" fill="#4a4a4a" text-anchor="middle">HasilCek</text></svg>