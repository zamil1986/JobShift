" font-weight="bold" fill="#1B2A7A" text-anchor="end">__ dari __</text><text x="704" y="337" font-family="GSans" font-size="10" fill="#4a4a4a" text-anchor="start">angka dibaca otomatis dari hasil npm run eval</text><text x="704" y="365" font-family="GSans" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="start">Batasan</text><text x="704" y="383" font-family="GSans" font-size="11" fill="#1a1a1a" text-anchor="start">Dioptimalkan untuk bahasa Indonesia.</text><text x="704" y="398" font-family="GSans" font-size="11" fill="#1a1a1a" text-anchor="start">Hasil adalah indikasi risiko, bukan</text><text x="704" y="413" font-family="GSans" font-size="11" fill="#1a1a1a" text-anchor="start">vonis hukum.</text><text x="704" y="440" font-family="GSans" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="start">Privasi</text><text x="704" y="458" font-family="GSans" font-size="11" fill="#1a1a1a" text-anchor="start">Teks tidak disimpan. Nomor HP, NIK,</text><text x="704" y="473" font-family="GSans" font-size="11" fill="#1a1a1a" text-anchor="start">rekening, dan email disamarkan sebelum</text><text x="704" y="488" font-family="GSans" font-size="11" fill="#1a1a1a" text-anchor="start">dikirim ke AI.</text></svg>