<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker><marker id="oa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#1a1a1a" stroke-width="1.3"/></marker><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#fff" stroke="#1a1a1a" stroke-width="1.3"/></marker></defs><rect width="1000" height="430" fill="#fff"/><text x="500" y="34" font-family="GSans" font-size="17" font-weight="bold" fill="#1B2A7A" text-anchor="middle">Satu Cek: dari Teks ke Label</text><rect x="20" y="60" width="170" height="120" rx="8" fill="#f6f6f4" stroke="#1a1a1a" stroke-width="1.6"/><text x="105.0" y="100.44999999999999" font-family="GSans" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Teks lowongan</text><text x="105.0" y="120.94999999999999" font-family="GSans" font-size="12" fill="#4a4a4a" text-anchor="middle">ditempel atau hasil</text><text x="105.0" y="136.55" font-family="GSans" font-size="12" fill="#4a4a4a" text-anchor="middle">OCR yang sudah</text><text x="105.0" y="152.15" font-family="GSans" font-size="12" fill="#4a4a4a" text-anchor="middle">dikonfirmasi</text><rect x="240" y="55" width="300" height="70" rx="8" fill="#E8ECFB" stroke="#1B2A7A" stroke-width="1.6"/><text x="390.0" y="79.55" font-family="GSans" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Aturan (Teks asli)</text><text x="390.0" y="98.75" font-family="GSans" font-size="11" fill="#4a4a4a" text-anchor="middle">kritis = 60 · non-kritis 10–25</text><text x="390.0" y="113.05000000000001" font-family="GSans" font-size="11" fill="#4a4a4a" text-anchor="middle">Penyangkal ≤ 3 kata membatalkan R01/R02</text><rect x="240" y="140" width="300" height="70" rx="8" fill="#f3e8fd" stroke="#5b2a86" stroke-width="1.6"/><text x="390.0" y="164.54999999999998" font-family="GSans" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">AI (Teks tersamar)</text><text x="390.0" y="183.75" font-family="GSans" font-size="11" fill="#4a4a4a" text-anchor="middle">+10 per Tanda bahaya sah, maks. +25</text><text x="390.0" y="198.04999999999998" font-family="GSans" font-size="11" fill="#4a4a4a" text-anchor="middle">tidak pernah menurunkan Skor</text><line x1="190" y1="110" x2="240" y2="90" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ah)"/><line x1="190" y1="130" x2="240" y2="175" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ah)"/><rect x="590" y="85" width="390" height="100" rx="8" fill="#fff" stroke="#1a1a1a" stroke-width="1.6"/><text x="785.0" y="115.44999999999999" font-family="GSans" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Skor = min(100, Σ bobot Aturan</text><text x="785.0" y="135.95" font-family="GSans" font-size="12" fill="#4a4a4a" text-anchor="middle">+ Tanda bahaya tersirat + min(25, 10 × n AI))</text><text x="785.0" y="151.55" font-family="GSans" font-size="12" fill="#4a4a4a" text-anchor="middle">Setiap poin bisa ditunjuk ke kalimat di Teks</text><text x="785.0" y="167.15" font-family="GSans" font-size="12" fill="#4a4a4a" text-anchor="middle">atau ke informasi yang tidak ada</text><line x1="540" y1="90" x2="590" y2="120" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ah)"/><line x1="540" y1="175" x2="590" y2="150" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ah)"/><rect x="60.0" y="250" width="220.0" height="54" rx="0" fill="#e7f3ea" stroke="#14532d" stroke-width="2"/><text x="170.0" y="275" font-family="GSans" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Risiko rendah</text><text x="170.0" y="294" font-family="GSans" font-size="12" fill="#14532d" text-anchor="middle">Skor 0–24</text><rect x="280.0" y="250" width="308.0" height="54" rx="0" fill="#fff3e0" stroke="#7a3e00" stroke-width="2"/><text x="434.0" y="275" font-family="GSans" font-size="16" font-weight="bold" fill="#7a3e00" text-anchor="middle">Waspada</text><text x="434.0" y="294" font-family="GSans" font-size="12" fill="#7a3e00" text-anchor="middle">Skor 25–59</text><rect x="588.0" y="250" width="352.0" height="54" rx="0" fill="#fdecea" stroke="#8c0b0b" stroke-width="2"/><text x="764.0" y="275" font-family="GSans" font-size="16" font-weight="bold" fill="#8c0b0b" text-anchor="middle">Bahaya</text><text x="764.0" y="294" font-family="GSans" font-size="12" fill="#8c0b0b" text-anchor="middle">Skor 60–100</text><text x="60.0" y="324" font-family="GSans" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">0</text><text x="280.0" y="324" font-family="GSans" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">25</text><text x="588.0" y="324" font-family="GSans" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">60</text><text x="940.0" y="324" font-family="GSans" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">100</text><line x1="785" y1="185" x2="785" y2="245" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ah)"/><text x="500" y="360" font-family="GSans" font-size="13" fill="#4a4a4a" text-anchor="middle">Satu Aturan kritis (misalnya meminta uang sebelum diterima) sudah cukup untuk Bahaya.</text><text x="500" y="380" font-family="GSans" font-size="13" fill="#4a4a4a" text-anchor="middle">AI sendirian paling banyak +25, jadi AI bisa menaikkan ke Waspada tetapi tidak pernah membuat Bahaya.</text><text x="500" y="400" font-family="GSans" font-size="13" fill="#4a4a4a" text-anchor="middle">Risiko rendah selalu disertai peringatan bahwa hasil ini bukan jaminan.</text></svg>